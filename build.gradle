plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mms_economy" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    runtimeMods {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cardinal Components modules extracted from the nested jars, compile only.
    compileOnly files(
        "libs/26.3/cardinal-components-base-${project.cardinal_version}.jar",
        "libs/26.3/cardinal-components-entity-${project.cardinal_version}.jar"
    )

    // Dev runtime: Cardinal Components, the soft-suggested Rubies mod and the uproot shim that lets it load.
    runtimeMods files(
        "libs/26.3/cardinal-components-api-${project.cardinal_version}.jar",
        "libs/26.3/rubies-1.0.0+1.21.11.jar",
        "libs/26.3/mms-uproot-0.1.0.jar"
    )
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Copies the runtime mods into the dev run's mods folder.
tasks.register("syncRuntimeMods") {
    inputs.files(configurations.runtimeMods)
    doLast {
        copy {
            from configurations.runtimeMods
            into file("run/mods")
        }
    }
}

["runClient", "runServer"].each { runName ->
    tasks.named(runName) {
        dependsOn "syncRuntimeMods"
    }
}
